# Dependabot config: one grouped monthly PR per ecosystem.
version: 2
updates:
  # Rust: the root Cargo.lock covers every workspace member (kururu-su, -display, -wake, -sentinel).
  # crates/kururu-display/Cargo.lock is an orphan: the crate inherits edition/version from the
  # workspace root, so Dependabot cannot resolve that directory on its own.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    # Majors arrive as separate PRs (not ignored) so security fixes that need a major are not suppressed.
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # GitHub Actions workflows (.github/workflows/ci.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
