name: ci

# Governance audit by StenioSentinel.
#
# Uses the composite action published by the engine itself, which downloads the
# already-compiled release binary instead of building Rust here (CI in seconds, and a
# single engine version for all repositories).
#
# Ver: https://github.com/ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Governance Audit (Rust Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: StenioSentinel — auditar repositório
        uses: ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check@v1
        with:
          scope: all
          path: .
          github-format: "true"
