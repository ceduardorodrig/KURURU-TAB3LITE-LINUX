[package]
name = "kururu-display"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alacritty_terminal = "0.25"
portable-pty = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
