[package]
name = "kururu-display"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alacritty_terminal = "0.25"
portable-pty = "0.8"
ratatui = { version = "0.29", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
